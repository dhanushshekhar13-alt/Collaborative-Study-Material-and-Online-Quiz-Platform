<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyHub</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="api.js" defer></script>
    <script src="study.js" defer></script>
    <script src="community.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/channels">StudyHub</a>
      <nav id="nav" hidden>
        <a href="#/channels" data-nav="channels">Channels</a>
        <a href="#/my-channels" data-nav="my-channels">My Channels</a>
        <a href="#/materials" data-nav="materials">Materials</a>
        <a href="#/questions" data-nav="questions">Questions</a>
        <a href="#/quizzes" data-nav="quizzes">Quizzes</a>
        <a href="#/history" data-nav="history">Quiz History</a>
        <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
        <a href="#/performance" data-nav="performance">Performance</a>
        <a href="#/recommended" data-nav="recommended">Recommended</a>
        <a href="#/messages" data-nav="messages">Messages</a>
        <a href="#/ask" data-nav="ask">Ask AI</a>
        <a href="#/moderation" data-nav="moderation" data-cap="report:resolve official_content:manage" hidden>Moderation</a>
        <a href="#/admin" data-nav="admin" data-cap="admin:dashboard" hidden>Admin</a>
        <a href="#/profile" data-nav="profile">Profile</a>
        <a href="#/notifications" data-nav="notifications" id="bell" class="bell" aria-label="Notifications" title="Notifications">🔔<span id="bell-count" class="bell-count" hidden></span></a>
        <span id="whoami" class="muted"></span>
        <button id="logout" type="button" class="link">Log out</button>
      </nav>
    </header>
    <main id="view" tabindex="-1">
      <noscript>This app needs JavaScript.</noscript>
    </main>
  </body>
</html>
